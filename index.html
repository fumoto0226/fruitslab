<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Bento — React + drei (verbatim reference stack)</title>
  <link rel="stylesheet" href="./src/styles/global.css" />

  <!-- Import map — R3F / drei / csg all share one three + react version so peer deps resolve -->
  <script type="importmap">
  {
    "imports": {
      "react":              "https://esm.sh/react@19.2.8",
      "react/jsx-runtime":  "https://esm.sh/react@19.2.8/jsx-runtime",
      "react-dom":          "https://esm.sh/react-dom@19.2.8",
      "react-dom/client":   "https://esm.sh/react-dom@19.2.8/client",
      "three":              "https://esm.sh/three@0.169.0",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.6.1?deps=react@19.2.8,three@0.169.0&external=react,three",
      "@react-three/drei":  "https://esm.sh/@react-three/drei@10.7.7?deps=react@19.2.8,three@0.169.0,@react-three/fiber@9.6.1&external=react,three,@react-three/fiber",
      "@react-three/csg":   "https://esm.sh/@react-three/csg@4.0.0?deps=react@19.2.8,three@0.169.0,@react-three/fiber@9.6.1&external=react,three,@react-three/fiber",
      "three-stdlib":       "https://esm.sh/three-stdlib@2.35.0?deps=three@0.169.0&external=three"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- error surface so we can see cross-origin script errors -->
  <pre id="err" style="position:fixed;top:10px;left:10px;right:10px;background:rgba(180,0,0,0.92);color:#fff;padding:10px 14px;font:12px monospace;white-space:pre-wrap;display:none;z-index:99;border-radius:8px;max-height:60vh;overflow:auto"></pre>
  <script>
    window.addEventListener('error', e => {
      const el = document.getElementById('err'); el.style.display = 'block';
      el.textContent = '[error] ' + (e.error?.stack || e.error?.message || e.message);
    });
    window.addEventListener('unhandledrejection', e => {
      const el = document.getElementById('err'); el.style.display = 'block';
      el.textContent = '[promise] ' + (e.reason?.stack || e.reason?.message || e.reason);
    });
  </script>

  <!--
    本地调切片 PNG 时不要加载打包版 textures-all.js。
    这个文件里是旧的 base64 图片；如果加载它，删改 Cut Fruit 里的 PNG 后网页仍会显示旧图。
  -->
  <!-- <script src="img/fruits/Cut Fruit/textures-all.js"></script> -->


  <script type="module" src="./dist/app.js"></script>
</body>
</html>
